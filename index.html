<style>
:root {
  --accent: #B7A0CC;
  --accent-deep: #7C5E96;
  --accent-light: #D9CCE6;
  --bg: #FAF7F6;
  --card-bg: #FDFBFA;
  --ink: #3B2E42;
  --soft: #8A7B90;
}
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; }

  .stage {
    width: 100%;
    max-width: 1000px;
    min-height: 100vh;
    margin: 0 auto;
    position: relative;
    background: var(--bg);
    overflow: hidden;
    font-family: 'EB Garamond', Georgia, serif;
  }

  /* ========== PAGE D'ENTRÉE : papier + logo ========== */
  /*
    Centrage calculé pour tout écran :
    - gate = viewport fixe (inset: 0)
    - logo = absolute left/top 50% + translate(-50%, -50%)
    - taille = vmin (plus petit côté) pour garder proportions & centre
  */
  .gate {
    position: fixed;
    inset: 0;
    z-index: 10;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    max-width: none;
    background-color: var(--bg);
    background-image: url('fondpapier.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    overflow: hidden;
    transition: opacity 0.7s ease 0.15s, visibility 0.7s ease 0.15s;
  }
  .gate.is-done {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .logo-btn {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    background: transparent;
    padding: 0;
    margin: 0;
    cursor: pointer;
    font: inherit;
    position: absolute;
    left: 50%;
    top: 50%;
    /* Largeur = 58% du plus petit côté de l'écran, plafonnée */
    width: min(58vmin, 420px);
    max-width: calc(100% - 48px);
    /* Vrai centre géométrique, tous viewports */
    transform: translate(-50%, -50%);
    opacity: 1;
    transition:
      transform 1.15s cubic-bezier(0.33, 0.1, 0.2, 1),
      opacity 0.85s ease 0.15s;
  }
  .gate.is-rising .logo-btn {
    /* Conserve le -50% horizontal, monte hors écran */
    transform: translate(-50%, calc(-50% - 120vh));
    opacity: 0;
  }
  .logo-btn:focus-visible {
    outline: 2px solid var(--accent-deep);
    outline-offset: 10px;
  }
  .logo-btn img {
    width: 100%;
    height: auto;
    aspect-ratio: 1;
    display: block;
    object-fit: contain;
    object-position: center;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .gate,
    .logo-btn,
    #carousel { transition: none !important; }
    .gate.is-rising .logo-btn {
      transform: translate(-50%, -50%);
      opacity: 0;
    }
  }

  /* ========== CARROUSEL — présentation papeterie ========== */
  #carousel {
    display: none;
    opacity: 0;
    transition: opacity 1s ease;
  }
  #carousel.is-visible {
    display: block;
    opacity: 1;
  }

  .carousel-inner {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 3vh, 40px) 12px;
    box-sizing: border-box;
    /* Même papier que l'entrée — continuité visuelle */
    background-color: var(--bg);
    background-image: url('fondpapier.png');
    background-size: cover;
    background-position: center;
  }

  .carousel-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vw, 28px);
    width: 100%;
    max-width: 100%;
  }

  /*
    Carte entière visible sur tout écran :
    largeur plafonnée par la largeur dispo ET par la hauteur dispo (ratio 1240×1748)
  */
  .card-slot {
    --card-max-h: calc(100dvh - 56px);
    position: relative;
    width: min(
      340px,
      calc(100vw - 96px),
      calc(var(--card-max-h) * 1240 / 1748)
    );
    aspect-ratio: 1240 / 1748;
    max-height: var(--card-max-h);
    flex: none;
    padding: 0;
    background: transparent;
    border: none;
    box-shadow:
      0 18px 40px -18px rgba(59, 46, 66, 0.14),
      0 6px 14px -8px rgba(124, 94, 150, 0.08);
  }

  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.55s ease, visibility 0.55s ease;
    z-index: 1;
  }
  .slide.is-active {
    opacity: 1;
    visibility: visible;
    z-index: 1;
  }

  .slide-card {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    object-position: center;
    background: var(--card-bg);
  }

  .slide-placeholder {
    width: 100%;
    height: 100%;
    background: var(--card-bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 40px;
  }

  /* Flèches discrètes, style gravure */
  .nav-btn {
    all: unset;
    cursor: pointer;
    width: 44px;
    height: 44px;
    border: 1px solid var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    background: var(--card-bg);
    color: var(--accent-deep);
    transition:
      border-color 0.3s ease,
      background-color 0.3s ease,
      transform 0.3s ease;
  }
  .nav-btn:hover {
    border-color: var(--accent-deep);
    background-color: var(--accent-light);
    transform: scale(1.04);
  }
  .nav-btn:focus-visible {
    outline: 2px solid var(--accent-deep);
    outline-offset: 3px;
  }
  .nav-btn svg {
    display: block;
  }

  @media (max-width: 600px) {
    .carousel-row { gap: 6px; }
    .nav-btn { width: 34px; height: 34px; }
    .card-slot {
      --card-max-h: calc(100dvh - 48px);
      width: min(
        300px,
        calc(100vw - 80px),
        calc(var(--card-max-h) * 1240 / 1748)
      );
    }
  }

  @media (max-height: 700px) {
    .card-slot {
      --card-max-h: calc(100dvh - 40px);
      width: min(
        280px,
        calc(100vw - 88px),
        calc(var(--card-max-h) * 1240 / 1748)
      );
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .slide { transition: none !important; }
  }
</style>
</head>
<body>
<div class="stage">

  <!-- ===================== LOGO SUR PAPIER ===================== -->
  <div id="gate" class="gate">
    <button id="openBtn" class="logo-btn" aria-label="Entrer dans l'invitation">
      <img src="logowf.png" alt="Monogramme" width="366" height="366" decoding="async">
    </button>
  </div>

  <!-- ===================== CARROUSEL ===================== -->
  <div id="carousel">
  <div class="carousel-inner">

    <div class="carousel-row">

      <button id="prevBtn" class="nav-btn" aria-label="Carte précédente">
        <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="card-slot" aria-live="polite">

        <div class="slide is-active" data-slide="0">
          <img
            class="slide-card"
            src="accueil.jpg"
            alt="Faire-part Accueil — Ilana &amp; Jonathan, 25 mai 2027"
            width="1240"
            height="1748"
            decoding="async"
          >
        </div>

        <div class="slide" data-slide="1">
          <img
            class="slide-card"
            src="mairie.png"
            alt="Faire-part Mairie — Ilana &amp; Jonathan"
            width="1240"
            height="1748"
            decoding="async"
          >
        </div>

        <div class="slide" data-slide="2">
          <div class="slide-placeholder">
            <div style="font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 14px; letter-spacing: 3px; color: var(--accent-deep); text-transform: uppercase;">Houppa</div>
            <div style="font-size: 14px; color: var(--soft); font-style: italic;">à venir</div>
          </div>
        </div>

      </div>

      <button id="nextBtn" class="nav-btn" aria-label="Carte suivante">
        <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 L17 12 L9 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

    </div>

  </div>
  </div>

</div>


<script>
(function () {
  var idx = 0;
  var total = 3;
  var opening = false;
  var gate = document.getElementById('gate');
  var carousel = document.getElementById('carousel');
  var openBtn = document.getElementById('openBtn');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var slides = document.querySelectorAll('.slide');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function render() {
    slides.forEach(function (el) {
      var active = parseInt(el.getAttribute('data-slide'), 10) === idx;
      el.classList.toggle('is-active', active);
    });
  }

  openBtn.addEventListener('click', function () {
    if (opening) return;
    opening = true;

    // Le logo monte, puis la page carrousel apparaît
    gate.classList.add('is-rising');
    carousel.classList.add('is-visible');

    var riseMs = reduceMotion ? 0 : 1100;
    setTimeout(function () {
      gate.classList.add('is-done');
      setTimeout(function () {
        gate.style.display = 'none';
      }, reduceMotion ? 0 : 700);
    }, riseMs);
  });

  prevBtn.addEventListener('click', function () {
    idx = (idx - 1 + total) % total;
    render();
  });

  nextBtn.addEventListener('click', function () {
    idx = (idx + 1) % total;
    render();
  });

  render();
})();
</script>
</body>
</html>
