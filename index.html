<head>
<meta charset="utf-8">

<title>Ilana &amp; Jonathan — Faire-part de mariage</title>
<meta name="description" content="Ilana &amp; Jonathan ont le plaisir de vous convier à leur mariage.">

<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="Ilana &amp; Jonathan">
<meta property="og:title" content="Ilana &amp; Jonathan — Faire-part de mariage">
<meta property="og:description" content="Ilana &amp; Jonathan ont le plaisir de vous convier à leur mariage.">
<meta property="og:url" content="https://shisabbah.github.io/ilana-jonathan/">
<meta property="og:image" content="https://shisabbah.github.io/ilana-jonathan/logo2.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta property="og:image:alt" content="Monogramme Ilana &amp; Jonathan">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ilana &amp; Jonathan — Faire-part de mariage">
<meta name="twitter:description" content="Ilana &amp; Jonathan ont le plaisir de vous convier à leur mariage.">
<meta name="twitter:image" content="https://shisabbah.github.io/ilana-jonathan/logo2.png">
<link rel="icon" type="image/png" href="logo2.png">
<link rel="apple-touch-icon" href="logo2.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

:root {
  --accent: #B7A0CC;
  --accent-deep: #7C5E96;
  --bg: #F6F2ED;
  --ink: #3B2E42;
  --soft: #8A7B90;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font-family: 'EB Garamond', Georgia, serif;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; }

/* —— Accueil —— */
.accueil {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2.25rem;
  padding: 2rem 1.5rem max(2rem, env(safe-area-inset-bottom));
  background-color: var(--bg);
  background-image: url('fondpapier.png');
  background-size: cover;
  background-position: center;
  cursor: pointer;
  border: 0;
  width: 100%;
  appearance: none;
  transition: opacity 0.7s ease, visibility 0.7s ease;
}
.accueil.is-done {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.accueil-logo {
  width: min(58vmin, 22rem);
  max-width: calc(100vw - 3rem);
  pointer-events: none;
  transition:
    transform 1.1s cubic-bezier(0.33, 0.1, 0.2, 1),
    opacity 0.8s ease 0.1s;
}
.accueil.is-rising .accueil-logo {
  transform: translateY(-110vh);
  opacity: 0;
}
.accueil-logo img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1;
  object-fit: contain;
}

.accueil-hint {
  margin: 0;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 500;
  font-size: clamp(0.85rem, 3.2vw, 1.05rem);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent-deep);
  text-align: center;
  max-width: 18rem;
  line-height: 1.55;
  opacity: 0.9;
  animation: hint-pulse 2.8s ease-in-out infinite;
  pointer-events: none;
  transition: opacity 0.5s ease;
}
.accueil.is-rising .accueil-hint {
  opacity: 0;
  animation: none;
}

@keyframes hint-pulse {
  0%, 100% { opacity: 0.55; }
  50% { opacity: 1; }
}

.accueil:focus-visible {
  outline: 2px solid var(--accent-deep);
  outline-offset: -0.5rem;
}

/* —— Pages invitation (image par image) —— */
#pages {
  display: none;
  min-height: 100dvh;
  opacity: 0;
  transition: opacity 0.85s ease;
}
#pages.is-visible {
  display: block;
  opacity: 1;
}

.page {
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: max(1rem, env(safe-area-inset-top)) 0.75rem max(1.25rem, env(safe-area-inset-bottom));
  background-color: var(--bg);
  background-image: url('fondpapier.png');
  background-size: cover;
  background-position: center;
}

.page img {
  display: block;
  width: 100%;
  max-width: min(100%, 28rem);
  height: auto;
  margin: 0 auto;
  box-shadow: 0 1.25rem 2.75rem -1.25rem rgba(59, 46, 66, 0.18);
}

/* —— Musique —— */
.music-btn {
  position: fixed;
  z-index: 40;
  right: max(1rem, env(safe-area-inset-right));
  bottom: max(1rem, env(safe-area-inset-bottom));
  width: 2.75rem;
  height: 2.75rem;
  border: 1px solid var(--accent);
  border-radius: 50%;
  background: rgba(251, 248, 244, 0.92);
  color: var(--accent-deep);
  cursor: pointer;
  display: none;
  place-items: center;
  box-shadow: 0 0.4rem 1rem -0.35rem rgba(59, 46, 66, 0.2);
  transition: opacity 0.35s ease, transform 0.2s ease;
}
.music-btn.is-on {
  display: grid;
}
.music-btn:active { transform: scale(0.96); }
.music-btn:focus-visible {
  outline: 2px solid var(--accent-deep);
  outline-offset: 3px;
}
.music-btn svg {
  width: 1.15rem;
  height: 1.15rem;
  fill: currentColor;
}
.music-btn .icon-off { display: none; }
.music-btn.is-muted .icon-on { display: none; }
.music-btn.is-muted .icon-off { display: block; }

@media (prefers-reduced-motion: reduce) {
  .accueil, .accueil-logo, #pages { transition: none !important; }
  .accueil-hint { animation: none; }
  .accueil.is-rising .accueil-logo {
    transform: none;
    opacity: 0;
  }
}
</style>
</head>
<body>

  <button type="button" class="accueil" id="accueil" aria-label="Ouvrir l'invitation">
    <span class="accueil-logo">
      <img src="logowf.png" alt="Monogramme Ilana et Jonathan" width="366" height="366" decoding="async">
    </span>
    <p class="accueil-hint">Cliquer sur la page<br>pour ouvrir l’invitation</p>
  </button>

  <main id="pages">
    <section class="page" aria-label="La Mairie">
      <img src="mairie1.png" alt="Invitation — La Mairie : Ilana et Jonathan se diront oui le 25 mai 2027 à 14h30, Mairie Bagatelle, Marseille" width="1056" height="1489" decoding="async">
    </section>
    <section class="page" aria-label="La Houppa">
      <img src="houppa3.png" alt="Invitation — La Houppa : cérémonie religieuse le jeudi 27 mai à 15h00 au Domaine des Calanques" width="941" height="1672" decoding="async" loading="lazy">
    </section>
  </main>

  <audio id="bgMusic" src="musique.mp3" loop preload="auto" playsinline></audio>

  <button type="button" class="music-btn" id="musicBtn" aria-label="Couper la musique" aria-pressed="false" hidden>
    <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h3l4 3V7L6 10H3zm11.5 2a2.5 2.5 0 0 0-1.5-2.3v4.6a2.5 2.5 0 0 0 1.5-2.3zm-1.5-6.2v1.6a4.5 4.5 0 0 1 0 9.2v1.6a6.1 6.1 0 0 0 0-12.4z"/></svg>
    <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 12a2.5 2.5 0 0 0-1.5-2.3v2.5l1.5 1.5V12zm2.5 0c0 .9-.2 1.7-.6 2.4l1.2 1.2A5.9 5.9 0 0 0 20.5 12a6.1 6.1 0 0 0-3.5-5.5v1.6A4.5 4.5 0 0 1 19 12zM4.3 3 3 4.3 7.7 9H3v4h3l4 3v-5.7l5.7 5.7 1.3-1.3L4.3 3zM14 3.2v1.6l-2 2V3.2L14 3.2z"/></svg>
  </button>

<script>
(function () {
  var accueil = document.getElementById('accueil');
  var pages = document.getElementById('pages');
  var music = document.getElementById('bgMusic');
  var musicBtn = document.getElementById('musicBtn');
  var opened = false;

  music.volume = 0.55;

  function setMuted(muted) {
    music.muted = muted;
    musicBtn.classList.toggle('is-muted', muted);
    musicBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
    musicBtn.setAttribute('aria-label', muted ? 'Remettre la musique' : 'Couper la musique');
  }

  function startMusic() {
    music.play().then(function () {
      musicBtn.hidden = false;
      musicBtn.classList.add('is-on');
      setMuted(false);
    }).catch(function () {
      /* Lecture bloquée : bouton visible pour lancer manuellement */
      musicBtn.hidden = false;
      musicBtn.classList.add('is-on', 'is-muted');
      setMuted(true);
    });
  }

  function openInvite() {
    if (opened) return;
    opened = true;
    accueil.classList.add('is-rising');
    pages.style.display = 'block';
    requestAnimationFrame(function () {
      pages.classList.add('is-visible');
    });
    window.setTimeout(function () {
      accueil.classList.add('is-done');
    }, 1100);
    startMusic();
  }

  musicBtn.addEventListener('click', function () {
    if (music.paused) {
      music.muted = false;
      music.play().then(function () { setMuted(false); }).catch(function () {});
      return;
    }
    setMuted(!music.muted);
  });

  accueil.addEventListener('click', openInvite);
  accueil.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openInvite();
    }
  });
})();
</script>
</body>
</html>
