<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ilana &amp; Jonathan</title>
<meta name="description" content="Ilana &amp; Jonathan ont le plaisir de vous convier à leur mariage le 27 Mai.">

<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="Ilana &amp; Jonathan">
<meta property="og:title" content="Ilana &amp; Jonathan">
<meta property="og:description" content="leur mariage le 27 mai">
<meta property="og:url" content="https://ilana-jonathan.netlify.app/">
<meta property="og:image" content="https://ilana-jonathan.netlify.app/logo2.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta property="og:image:alt" content="Monogramme Ilana &amp; Jonathan">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ilana &amp; Jonathan">
<meta name="twitter:description" content="leur mariage le 27 mai">
<meta name="twitter:image" content="https://ilana-jonathan.netlify.app/logo2.png">
<link rel="icon" type="image/png" href="logo2.png">
<link rel="apple-touch-icon" href="logo2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
:root {
  --accent: #B7A0CC;
  --accent-deep: #7C5E96;
  --accent-soft: #D4C6E0;
  --accent-light: #E8DFEF;
  --bg: #F4F0EA;
  --paper: #FBF8F4;
  --ink: #3B2E42;
  --soft: #8A7B90;
  --gold: #A8926A;
  --shadow: 0 1.1rem 2.4rem -1.4rem rgba(59, 46, 66, 0.16);
  --ease-invite: cubic-bezier(0.22, 0.61, 0.36, 1);
  --font-display: 'Cormorant Garamond', 'Times New Roman', serif;
  --font-body: 'EB Garamond', Georgia, serif;
}

*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}
html.is-reading {
  scroll-snap-type: y proximity;
}

body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

button { font: inherit; }

/* ========== COUVERTURE ========== */
.accueil {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2rem;
  padding:
    max(2.5rem, env(safe-area-inset-top))
    1.5rem
    max(2.5rem, env(safe-area-inset-bottom));
  background-color: var(--bg);
  background-image: url('fondpapier.png');
  background-size: cover;
  background-position: center;
  cursor: pointer;
  border: 0;
  width: 100%;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  transform-origin: 50% 40%;
  transition:
    opacity 0.85s var(--ease-invite),
    transform 0.95s var(--ease-invite),
    visibility 0.85s var(--ease-invite);
}
.accueil.is-opening {
  transform: translateY(-6%) scale(0.985);
  opacity: 0;
  pointer-events: none;
}
.accueil.is-done {
  visibility: hidden;
}

.accueil-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.85rem;
  max-width: 22rem;
  width: 100%;
}

.accueil-logo {
  width: min(52vmin, 17.5rem);
  max-width: calc(100% - 0.5rem);
  pointer-events: none;
  transition: transform 0.55s var(--ease-invite);
}
@media (hover: hover) and (pointer: fine) {
  .accueil:hover .accueil-logo {
    transform: translateY(-0.2rem);
  }
}
.accueil-logo img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1;
  object-fit: contain;
  filter: drop-shadow(0 0.35rem 0.9rem rgba(59, 46, 66, 0.06));
}

.accueil-cta {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.85rem;
  pointer-events: none;
  transition: opacity 0.4s ease, transform 0.55s var(--ease-invite);
}
.accueil.is-opening .accueil-cta {
  opacity: 0;
  transform: translateY(0.4rem);
}

.accueil-bubble {
  margin: 0;
  padding: 0.65rem 1.4rem 0.6rem;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 0.8rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent-deep);
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 70%, transparent);
  border-radius: 999px;
  line-height: 1.2;
}

.accueil-hint {
  margin: 0;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 400;
  font-size: 0.95rem;
  letter-spacing: 0.04em;
  color: var(--soft);
}

.accueil:focus-visible {
  outline: 2px solid var(--accent-deep);
  outline-offset: -0.6rem;
}

/* ========== INVITATIONS ========== */
#pages {
  display: none;
  min-height: 100dvh;
  opacity: 0;
  transform: translateY(1.1rem);
  transition:
    opacity 0.9s var(--ease-invite) 0.12s,
    transform 0.95s var(--ease-invite) 0.12s;
}
#pages.is-visible {
  display: block;
  opacity: 1;
  transform: none;
}

.page {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.15rem;
  padding:
    max(1.35rem, env(safe-area-inset-top))
    1rem
    max(1.75rem, env(safe-area-inset-bottom));
  background-color: var(--bg);
  background-image: url('fondpapier.png');
  background-size: cover;
  background-position: center;
  scroll-snap-align: start;
  scroll-snap-stop: always;
}

.page-head {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.55rem;
  width: min(100%, 26rem);
}

.page-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(0.78rem, 2.6vw, 0.88rem);
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--accent-deep);
  text-align: center;
}

.page-rule {
  width: 2.4rem;
  height: 1px;
  background: var(--accent);
  opacity: 0.75;
  border: 0;
  margin: 0;
}

.card {
  width: min(100%, 26rem);
  background: var(--paper);
  box-shadow: var(--shadow);
  line-height: 0;
}

.card img {
  display: block;
  width: 100%;
  height: auto;
  background: var(--paper);
}

.page-nav {
  margin: 0;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 0.9rem;
  color: var(--soft);
  letter-spacing: 0.03em;
}

.page-nav a {
  color: var(--accent-deep);
  text-decoration: none;
  border-bottom: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
  padding-bottom: 0.05em;
  transition: border-color 0.25s ease, color 0.25s ease;
}
@media (hover: hover) and (pointer: fine) {
  .page-nav a:hover {
    color: var(--ink);
    border-bottom-color: var(--accent-deep);
  }
}

/* ========== RSVP ========== */
.page--rsvp {
  justify-content: center;
}

/* Téléphone : le formulaire dépasse l’écran. Le snap recale
   la page en haut et le bouton Envoyer reste hors de portée. */
@media (max-height: 920px) {
  .page--rsvp {
    justify-content: flex-start;
    scroll-snap-align: none;
    scroll-snap-stop: normal;
    min-height: 0;
    gap: 0.7rem;
    padding-top: max(0.85rem, env(safe-area-inset-top));
    padding-bottom: max(4.5rem, calc(env(safe-area-inset-bottom) + 3.5rem));
  }
  .page--rsvp .rsvp-panel {
    padding: 0.85rem 1rem 0.95rem;
  }
  .page--rsvp .rsvp-lead {
    margin: 0 0 0.45rem;
    font-size: 1rem;
  }
  .page--rsvp .rsvp-form {
    gap: 0.65rem;
  }
  .page--rsvp .event-block {
    gap: 0.3rem;
    padding: 0.5rem 0.65rem 0.55rem;
  }
  .page--rsvp .event-meta {
    margin: 0 0 0.1rem;
  }
  .page--rsvp .choice label {
    min-height: 2.35rem;
    padding: 0.4rem;
  }
  .page--rsvp .event-block .guest-field {
    margin-top: 0.15rem;
    padding-top: 0.4rem;
  }
}

.page--rsvp .page-title {
  font-weight: 700;
  font-size: clamp(1rem, 3.4vw, 1.2rem);
  letter-spacing: 0.28em;
  color: var(--ink);
}

.page--rsvp .page-rule {
  width: 3.2rem;
  height: 1.5px;
  opacity: 1;
  background: var(--accent-deep);
}

.rsvp-panel {
  width: min(100%, 26rem);
  background-color: var(--paper);
  background-image: url('fondpapier.png');
  background-size: cover;
  background-position: center;
  box-shadow: var(--shadow);
  padding: 1.85rem 1.4rem 2.1rem;
  text-align: center;
}

.rsvp-lead {
  margin: 0.35rem 0 1.25rem;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 600;
  font-size: 1.1rem;
  color: var(--ink);
}

.rsvp-form {
  width: 100%;
  max-width: 18rem;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 1.35rem;
  text-align: left;
}

.page--rsvp .field label,
.page--rsvp .field-label {
  font-weight: 700;
  font-style: normal;
  font-size: 0.75rem;
  letter-spacing: 0.14em;
  color: var(--ink);
}

.field label,
.field-label {
  display: block;
  margin-bottom: 0.35rem;
  font-family: var(--font-display);
  font-weight: 500;
  font-style: italic;
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent-deep);
}

.field input[type="text"],
.field input[type="number"] {
  width: 100%;
  padding: 0.55rem 0.1rem;
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 16px;
  color: var(--ink);
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--accent);
  border-radius: 0;
  outline: none;
  appearance: none;
  -webkit-appearance: none;
}
.field input:focus {
  border-bottom-color: var(--accent-deep);
}

.event-block {
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
  margin: 0;
  min-width: 0;
  padding: 0.85rem 0.85rem 1.05rem;
  border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
  background: color-mix(in srgb, var(--paper) 75%, transparent);
}
.event-name {
  margin: 0 auto 0.15rem;
  padding: 0 0.4rem;
  width: auto;
  float: none;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.88rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink);
  text-align: center;
}
.event-meta {
  margin: -0.15rem 0 0.35rem;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 0.8rem;
  color: var(--soft);
  text-align: center;
}
.event-block .guest-field {
  margin-top: 0.35rem;
  padding-top: 0.65rem;
  border-top: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
}
.event-block.is-absent .guest-field {
  opacity: 0.4;
  pointer-events: none;
}

.choice {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.45rem;
}
.choice input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
  margin: 0;
  overflow: hidden;
}
.choice label {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.choice label {
  margin: 0;
  padding: 0.75rem 0.4rem;
  min-height: 2.75rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 600;
  font-style: normal;
  font-size: 0.9rem;
  letter-spacing: 0.12em;
  text-align: center;
  color: var(--ink);
  border: 1px solid var(--accent);
  background: color-mix(in srgb, var(--paper) 70%, transparent);
  cursor: pointer;
  transition: border-color 0.25s ease, color 0.25s ease, background-color 0.25s ease;
}
.choice input:checked + label {
  border-color: var(--accent-deep);
  color: var(--ink);
  font-weight: 700;
  background: var(--accent-light);
}
.choice input:focus-visible + label {
  outline: 2px solid var(--accent-deep);
  outline-offset: 2px;
}

.submit {
  appearance: none;
  align-self: center;
  margin-top: 0.2rem;
  padding: 0.85rem 1.7rem;
  min-height: 2.95rem;
  font-family: var(--font-display);
  font-weight: 700;
  font-style: normal;
  font-size: 0.88rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--paper);
  background: var(--accent-deep);
  border: 1px solid var(--accent-deep);
  cursor: pointer;
  transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
}
.submit:hover,
.submit:focus-visible {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
  outline: none;
}
.submit:disabled {
  opacity: 0.55;
  cursor: wait;
}

.rsvp-error {
  display: none;
  margin: 0;
  text-align: center;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 0.85rem;
  color: #8B4A5A;
}
.rsvp-block.has-error .rsvp-error { display: block; }

.rsvp-thanks {
  display: none;
  margin: 0.5rem auto 0;
  max-width: 16rem;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 1.15rem;
  line-height: 1.45;
  color: var(--ink);
}
.rsvp-block.is-sent .rsvp-form { display: none; }
.rsvp-block.is-sent .rsvp-thanks { display: block; }

/* ========== MUSIQUE ========== */
.music-btn {
  position: fixed;
  z-index: 40;
  right: max(0.9rem, env(safe-area-inset-right));
  bottom: max(0.9rem, env(safe-area-inset-bottom));
  width: 2.6rem;
  height: 2.6rem;
  border: 1px solid color-mix(in srgb, var(--accent) 65%, transparent);
  border-radius: 50%;
  background: color-mix(in srgb, var(--paper) 90%, transparent);
  color: var(--accent-deep);
  cursor: pointer;
  display: none;
  place-items: center;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: opacity 0.35s ease, transform 0.2s ease, border-color 0.25s ease;
  -webkit-tap-highlight-color: transparent;
}
.music-btn.is-on { display: grid; }
.music-btn:active { transform: scale(0.96); }
.music-btn:focus-visible {
  outline: 2px solid var(--accent-deep);
  outline-offset: 3px;
}
.music-btn svg {
  width: 1.05rem;
  height: 1.05rem;
  fill: currentColor;
}
.music-btn .icon-off { display: none; }
.music-btn.is-muted .icon-on { display: none; }
.music-btn.is-muted .icon-off { display: block; }

/* ========== RESPONSIVE ========== */
@media (min-width: 480px) {
  .accueil-logo { width: min(48vmin, 18.5rem); }
  .card { width: min(100%, 27rem); }
}

@media (min-width: 768px) {
  .accueil { gap: 2.25rem; }
  .accueil-logo { width: min(42vmin, 19rem); }
  .page {
    gap: 1.35rem;
    padding-inline: 1.5rem;
  }
  .card {
    width: min(100%, 28rem);
    box-shadow: 0 1.35rem 2.8rem -1.5rem rgba(59, 46, 66, 0.14);
  }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .accueil,
  .accueil-logo,
  .accueil-cta,
  #pages {
    transition: none !important;
  }
  .accueil.is-opening {
    transform: none;
  }
}
</style>
</head>
<body>

  <button type="button" class="accueil" id="accueil" aria-label="Ouvrir l'invitation">
    <span class="accueil-inner">
      <span class="accueil-logo">
        <img src="logowf.png" alt="Monogramme Ilana et Jonathan" width="366" height="366" decoding="async" fetchpriority="high">
      </span>
      <span class="accueil-cta">
        <span class="accueil-bubble">Voir l’invitation</span>
        <span class="accueil-hint">Toucher pour ouvrir</span>
      </span>
    </span>
  </button>

  <main id="pages">
    <section class="page" id="mairie" aria-labelledby="titleMairie">
      <header class="page-head">
        <h2 class="page-title" id="titleMairie">La Mairie</h2>
        <hr class="page-rule" aria-hidden="true">
      </header>
      <figure class="card">
        <img
          src="mairie1.png"
          alt="Invitation — La Mairie : Ilana et Jonathan se diront oui le 25 mai 2027 à 14h, Mairie Bagatelle, 125 rue du Commandant Rolland, 13008 Marseille"
          width="1056"
          height="1489"
          decoding="async">
      </figure>
      <p class="page-nav"><a href="#houppa">Continuer vers la Houppa</a></p>
    </section>

    <section class="page" id="houppa" aria-labelledby="titleHouppa">
      <header class="page-head">
        <h2 class="page-title" id="titleHouppa">La Houppa</h2>
        <hr class="page-rule" aria-hidden="true">
      </header>
      <figure class="card">
        <img
          src="houppa.png"
          alt="Invitation — La Houppa : cérémonie religieuse le jeudi 27 mai à 17h00 au Domaine de la Galinière, D7N, 13790 Châteauneuf-le-Rouge"
          width="941"
          height="1672"
          decoding="async"
          loading="lazy">
      </figure>
      <p class="page-nav"><a href="#rsvp">Confirmer votre présence</a></p>
    </section>

    <section class="page page--rsvp" id="rsvp" aria-labelledby="labelRsvp">
      <header class="page-head">
        <h2 class="page-title" id="labelRsvp">Réponse</h2>
        <hr class="page-rule" aria-hidden="true">
      </header>
      <div class="rsvp-panel rsvp-block" id="rsvpCard">
        <p class="rsvp-lead">Merci de confirmer pour chaque cérémonie</p>

        <form class="rsvp-form" id="rsvpForm" name="rsvp" method="POST" action="/" data-netlify="true" novalidate>
          <input type="hidden" name="form-name" value="rsvp">
          <input type="hidden" name="presence" id="rsvpPresence">
          <input type="hidden" name="guests" id="rsvpGuests">
          <div class="field">
            <label for="rsvpName">Nom &amp; prénom</label>
            <input id="rsvpName" name="name" type="text" autocomplete="name" required>
          </div>

          <fieldset class="field event-block" id="blockMairie">
            <legend class="event-name" id="labelMairieRsvp">La Mairie</legend>
            <p class="event-meta">Mardi 25 mai</p>
            <div class="choice" role="group" aria-labelledby="labelMairieRsvp">
              <input type="radio" id="mairieYes" name="mairie" value="oui" required>
              <label for="mairieYes">Oui</label>
              <input type="radio" id="mairieNo" name="mairie" value="non">
              <label for="mairieNo">Non</label>
            </div>
            <div class="guest-field">
              <label for="mairieGuests">Nombre pour la Mairie</label>
              <input id="mairieGuests" name="mairieGuests" type="number" min="1" max="20" value="1" inputmode="numeric" required>
            </div>
          </fieldset>

          <fieldset class="field event-block" id="blockHouppa">
            <legend class="event-name" id="labelHouppaRsvp">La Houppa</legend>
            <p class="event-meta">Jeudi 27 mai</p>
            <div class="choice" role="group" aria-labelledby="labelHouppaRsvp">
              <input type="radio" id="houppaYes" name="houppa" value="oui" required>
              <label for="houppaYes">Oui</label>
              <input type="radio" id="houppaNo" name="houppa" value="non">
              <label for="houppaNo">Non</label>
            </div>
            <div class="guest-field">
              <label for="houppaGuests">Nombre pour la Houppa</label>
              <input id="houppaGuests" name="houppaGuests" type="number" min="1" max="20" value="1" inputmode="numeric" required>
            </div>
          </fieldset>

          <button type="submit" class="submit" id="rsvpSubmit">Envoyer</button>
          <p class="rsvp-error" id="rsvpError" role="alert">Impossible d’envoyer pour le moment. Réessaie un peu plus tard.</p>
        </form>

        <p class="rsvp-thanks" role="status" aria-live="polite">
          Merci pour votre réponse.<br>Au plaisir de célébrer avec vous.
        </p>
      </div>
    </section>
  </main>

  <audio id="bgMusic" src="musique.mp3" preload="metadata" playsinline></audio>

  <button type="button" class="music-btn" id="musicBtn" aria-label="Couper la musique" aria-pressed="false" hidden>
    <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h3l4 3V7L6 10H3zm11.5 2a2.5 2.5 0 0 0-1.5-2.3v4.6a2.5 2.5 0 0 0 1.5-2.3zm-1.5-6.2v1.6a4.5 4.5 0 0 1 0 9.2v1.6a6.1 6.1 0 0 0 0-12.4z"/></svg>
    <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 12a2.5 2.5 0 0 0-1.5-2.3v2.5l1.5 1.5V12zm2.5 0c0 .9-.2 1.7-.6 2.4l1.2 1.2A5.9 5.9 0 0 0 20.5 12a6.1 6.1 0 0 0-3.5-5.5v1.6A4.5 4.5 0 0 1 19 12zM4.3 3 3 4.3 7.7 9H3v4h3l4 3v-5.7l5.7 5.7 1.3-1.3L4.3 3zM14 3.2v1.6l-2 2V3.2L14 3.2z"/></svg>
  </button>

<script>
(function () {
  var accueil = document.getElementById('accueil');
  var pages = document.getElementById('pages');
  var music = document.getElementById('bgMusic');
  var musicBtn = document.getElementById('musicBtn');
  var rsvpForm = document.getElementById('rsvpForm');
  var rsvpCard = document.getElementById('rsvpCard');
  var rsvpSubmit = document.getElementById('rsvpSubmit');
  var opened = false;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var MUSIC_START = 30; /* démarrage à 0:30 */
  music.volume = 0.48;

  function seekToStart() {
    try { music.currentTime = MUSIC_START; } catch (e) {}
  }

  music.addEventListener('loadedmetadata', seekToStart);
  music.addEventListener('ended', function () {
    seekToStart();
    music.play().catch(function () {});
  });

  function setMuted(muted) {
    music.muted = muted;
    musicBtn.classList.toggle('is-muted', muted);
    musicBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
    musicBtn.setAttribute('aria-label', muted ? 'Remettre la musique' : 'Couper la musique');
  }

  function startMusic() {
    seekToStart();
    music.play().then(function () {
      if (music.currentTime < MUSIC_START - 0.5) seekToStart();
      musicBtn.hidden = false;
      musicBtn.classList.add('is-on');
      setMuted(false);
    }).catch(function () {
      musicBtn.hidden = false;
      musicBtn.classList.add('is-on', 'is-muted');
      setMuted(true);
    });
  }

  function openInvite() {
    if (opened) return;
    opened = true;

    accueil.blur();
    pages.style.display = 'block';
    // Force reflow so the enter transition runs
    void pages.offsetWidth;
    pages.classList.add('is-visible');
    document.documentElement.classList.add('is-reading');
    accueil.classList.add('is-opening');

    window.setTimeout(function () {
      accueil.classList.add('is-done');
      accueil.tabIndex = -1;
      accueil.setAttribute('disabled', 'true');
      if ('inert' in accueil) accueil.inert = true;
    }, reduceMotion ? 0 : 950);

    startMusic();
  }

  musicBtn.addEventListener('click', function () {
    if (music.paused) {
      music.muted = false;
      seekToStart();
      music.play().then(function () { setMuted(false); }).catch(function () {});
      return;
    }
    setMuted(!music.muted);
  });

  accueil.addEventListener('click', openInvite);
  accueil.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openInvite();
    }
  });

  function syncGuestField(blockId, guestsId, value) {
    var block = document.getElementById(blockId);
    var guests = document.getElementById(guestsId);
    if (!block || !guests) return;
    var absent = value === 'non';
    block.classList.toggle('is-absent', absent);
    guests.disabled = absent;
    guests.required = !absent;
    guests.min = absent ? '0' : '1';
    guests.setCustomValidity('');
    if (absent) guests.value = '0';
    else if (guests.value === '' || guests.value === '0') guests.value = '1';
  }

  function guestCountInvalid(radioName, inputId) {
    var chosen = rsvpForm.querySelector('input[name="' + radioName + '"]:checked');
    var input = document.getElementById(inputId);
    if (!chosen || chosen.value !== 'oui') {
      input.setCustomValidity('');
      return false;
    }
    var count = Number(input.value);
    var invalid = input.value === '' || !isFinite(count) || count < 1 || count > 20;
    input.setCustomValidity(invalid ? 'Indiquez au moins une personne.' : '');
    return invalid;
  }

  if (rsvpForm) {
    rsvpForm.querySelectorAll('input[name="mairie"]').forEach(function (el) {
      el.addEventListener('change', function () {
        syncGuestField('blockMairie', 'mairieGuests', el.value);
      });
    });
    rsvpForm.querySelectorAll('input[name="houppa"]').forEach(function (el) {
      el.addEventListener('change', function () {
        syncGuestField('blockHouppa', 'houppaGuests', el.value);
      });
    });
  }

  if (rsvpForm && rsvpCard) {
    rsvpForm.addEventListener('submit', function (e) {
      e.preventDefault();
      rsvpCard.classList.remove('has-error');

      var nameInput = document.getElementById('rsvpName');
      nameInput.value = nameInput.value.replace(/\s+/g, ' ').trim();
      nameInput.setCustomValidity(nameInput.value ? '' : 'Indiquez votre nom et votre prénom.');
      guestCountInvalid('mairie', 'mairieGuests');
      guestCountInvalid('houppa', 'houppaGuests');

      if (!rsvpForm.checkValidity()) {
        rsvpForm.reportValidity();
        return;
      }

      var mairieEl = rsvpForm.querySelector('input[name="mairie"]:checked');
      var houppaEl = rsvpForm.querySelector('input[name="houppa"]:checked');
      var mairieGuests = document.getElementById('mairieGuests').value;
      var houppaGuests = document.getElementById('houppaGuests').value;
      var name = nameInput.value;
      document.getElementById('rsvpPresence').value = [
        'Mairie: ' + (mairieEl ? mairieEl.value : '') + ' (' + mairieGuests + ')',
        'Houppa: ' + (houppaEl ? houppaEl.value : '') + ' (' + houppaGuests + ')'
      ].join(' · ');
      document.getElementById('rsvpGuests').value = mairieGuests + ' / ' + houppaGuests;

      if (rsvpSubmit) {
        rsvpSubmit.disabled = true;
        rsvpSubmit.textContent = 'Envoi…';
      }

      /* Les champs désactivés (invité à 0) sont exclus du FormData. */
      var disabledFields = rsvpForm.querySelectorAll('input:disabled');
      disabledFields.forEach(function (el) { el.disabled = false; });
      var body = new URLSearchParams(new FormData(rsvpForm)).toString();
      disabledFields.forEach(function (el) { el.disabled = true; });

      fetch('/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body
      }).then(function (res) {
        if (!res.ok) throw new Error('status');
        rsvpCard.classList.add('is-sent');
      }).catch(function () {
        rsvpCard.classList.add('has-error');
        if (rsvpSubmit) {
          rsvpSubmit.disabled = false;
          rsvpSubmit.textContent = 'Envoyer';
        }
      });
    });
  }
})();
</script>
</body>
</html>
