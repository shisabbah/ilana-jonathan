<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ilana &amp; Jonathan — Accueil</title>
<style>
:root {
  --accent: #B7A0CC;
  --accent-deep: #7C5E96;
  --accent-light: #D9CCE6;
  --bg: #FAF7F6;
  --card-bg: #FDFBFA;
  --ink: #3B2E42;
  --soft: #8A7B90;
}
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; }

  .stage {
    width: 100%;
    max-width: 1000px;
    min-height: 100vh;
    margin: 0 auto;
    position: relative;
    background: var(--bg);
    overflow: hidden;
    font-family: 'EB Garamond', Georgia, serif;
  }

  /* ========== PAGE D'ENTRÉE : papier + logo ========== */
  /*
    Centrage calculé pour tout écran :
    - gate = viewport fixe (inset: 0)
    - logo = absolute left/top 50% + translate(-50%, -50%)
    - taille = vmin (plus petit côté) pour garder proportions & centre
  */
  .gate {
    position: fixed;
    inset: 0;
    z-index: 10;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    max-width: none;
    background-color: var(--bg);
    background-image: url('fondpapier.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    overflow: hidden;
    transition: opacity 0.7s ease 0.15s, visibility 0.7s ease 0.15s;
  }
  .gate.is-done {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .logo-btn {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    background: transparent;
    padding: 0;
    margin: 0;
    cursor: pointer;
    font: inherit;
    position: absolute;
    left: 50%;
    top: 50%;
    /* Largeur = 58% du plus petit côté de l'écran, plafonnée */
    width: min(58vmin, 420px);
    max-width: calc(100% - 48px);
    /* Vrai centre géométrique, tous viewports */
    transform: translate(-50%, -50%);
    opacity: 1;
    transition:
      transform 1.15s cubic-bezier(0.33, 0.1, 0.2, 1),
      opacity 0.85s ease 0.15s;
  }
  .gate.is-rising .logo-btn {
    /* Conserve le -50% horizontal, monte hors écran */
    transform: translate(-50%, calc(-50% - 120vh));
    opacity: 0;
  }
  .logo-btn:focus-visible {
    outline: 2px solid var(--accent-deep);
    outline-offset: 10px;
  }
  .logo-btn img {
    width: 100%;
    height: auto;
    aspect-ratio: 1;
    display: block;
    object-fit: contain;
    object-position: center;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .gate,
    .logo-btn,
    #carousel { transition: none !important; }
    .gate.is-rising .logo-btn {
      transform: translate(-50%, -50%);
      opacity: 0;
    }
  }

  /* ========== CARROUSEL ========== */
  #carousel {
    display: none;
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  #carousel.is-visible {
    display: block;
    opacity: 1;
  }

  .card-slot {
    position: relative;
    width: min(460px, calc(100vw - 120px));
    aspect-ratio: 1240 / 1748;
    flex: none;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: none;
  }
  .slide.is-active {
    display: block;
  }

  .slide-card {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    object-position: center;
    background: var(--card-bg);
  }

  .slide-placeholder {
    width: 100%;
    height: 100%;
    border: 1.5px dashed var(--accent);
    background: var(--card-bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 40px;
  }

  .nav-btn {
    all: unset;
    cursor: pointer;
    width: 40px;
    height: 40px;
    border: 1px solid var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    transition: border-color 0.25s ease, background-color 0.25s ease;
  }
  .nav-btn:hover,
  .nav-btn:focus-visible {
    border-color: var(--accent-deep);
    background-color: var(--accent-light);
    outline: none;
  }

  .carousel-row {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  @media (max-width: 600px) {
    .carousel-row { gap: 12px; }
    .nav-btn { width: 36px; height: 36px; }
    .card-slot { width: min(460px, calc(100vw - 88px)); }
  }
</style>
</head>
<body>
<div class="stage">

  <!-- ===================== LOGO SUR PAPIER ===================== -->
  <div id="gate" class="gate">
    <button id="openBtn" class="logo-btn" aria-label="Entrer dans l'invitation">
      <img src="logowf.png" alt="Monogramme" width="366" height="366" decoding="async">
    </button>
  </div>

  <!-- ===================== CARROUSEL ===================== -->
  <div id="carousel">
  <div style="position: relative; z-index: 2; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 32px 16px;">

    <div class="carousel-row">

      <button id="prevBtn" class="nav-btn" aria-label="Carte précédente">
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 L7 12 L15 20" fill="none" stroke="var(--accent-deep)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="card-slot" aria-live="polite">

        <div class="slide is-active" data-slide="0">
          <img
            class="slide-card"
            src="accueil.jpg"
            alt="Faire-part Accueil — Ilana &amp; Jonathan, 25 mai 2027"
            width="1240"
            height="1748"
            decoding="async"
          >
        </div>

        <div class="slide" data-slide="1">
          <img
            class="slide-card"
            src="mairie.png"
            alt="Faire-part Mairie — Ilana &amp; Jonathan"
            width="1240"
            height="1748"
            decoding="async"
          >
        </div>

        <div class="slide" data-slide="2">
          <div class="slide-placeholder">
            <svg width="46" height="46" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="15" rx="1.5" fill="none" stroke="var(--accent)" stroke-width="1.3"/><circle cx="8.5" cy="9.5" r="1.6" fill="none" stroke="var(--accent)" stroke-width="1.2"/><path d="M4 16 L9 11 L13 15 L16 12 L20 16" fill="none" stroke="var(--accent)" stroke-width="1.3"/></svg>
            <div style="font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 15px; letter-spacing: 2px; color: var(--accent-deep); text-transform: uppercase;">Houppa</div>
            <div style="font-size: 14px; color: var(--soft); font-style: italic;">emplacement pour ton PNG</div>
          </div>
        </div>

      </div>

      <button id="nextBtn" class="nav-btn" aria-label="Carte suivante">
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 L17 12 L9 20" fill="none" stroke="var(--accent-deep)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

    </div>

  </div>
  </div>

</div>


<script>
(function () {
  var idx = 0;
  var total = 3;
  var opening = false;
  var gate = document.getElementById('gate');
  var carousel = document.getElementById('carousel');
  var openBtn = document.getElementById('openBtn');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var slides = document.querySelectorAll('.slide');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function render() {
    slides.forEach(function (el) {
      var active = parseInt(el.getAttribute('data-slide'), 10) === idx;
      el.classList.toggle('is-active', active);
    });
  }

  openBtn.addEventListener('click', function () {
    if (opening) return;
    opening = true;

    // Le logo monte, puis la page carrousel apparaît
    gate.classList.add('is-rising');
    carousel.classList.add('is-visible');

    var riseMs = reduceMotion ? 0 : 1100;
    setTimeout(function () {
      gate.classList.add('is-done');
      setTimeout(function () {
        gate.style.display = 'none';
      }, reduceMotion ? 0 : 700);
    }, riseMs);
  });

  prevBtn.addEventListener('click', function () {
    idx = (idx - 1 + total) % total;
    render();
  });

  nextBtn.addEventListener('click', function () {
    idx = (idx + 1) % total;
    render();
  });

  render();
})();
</script>
</body>
</html>
