<meta name="twitter:title" content="Ilana &amp; Jonathan — Faire-part de mariage">

<link rel="icon" type="image/png" href="logo2.png">
<link rel="apple-touch-icon" href="logo2.png">
<style>
:root {
  --accent: #B7A0CC;
  --accent-deep: #7C5E96;
  --accent-light: #D9CCE6;
  --bg: #FAF7F6;
  --card-bg: #FDFBFA;
  --ink: #3B2E42;
  --soft: #8A7B90;
}
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&display=swap');

  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; }

  .stage {
    width: 100%;
    max-width: 1000px;
    min-height: 100vh;
    margin: 0 auto;
    position: relative;
    background: var(--bg);
    overflow: hidden;
    font-family: 'EB Garamond', Georgia, serif;
  }

  /* ========== PAGE D'ENTRÉE : papier + logo ========== */
  /*
    Centrage calculé pour tout écran :
    - gate = viewport fixe (inset: 0)
    - logo = absolute left/top 50% + translate(-50%, -50%)
    - taille = vmin (plus petit côté) pour garder proportions & centre
  */
  .gate {
    position: fixed;
    inset: 0;
    z-index: 10;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    max-width: none;
    background-color: var(--bg);
    background-image: url('fondpapier.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    overflow: hidden;
    transition: opacity 0.7s ease 0.15s, visibility 0.7s ease 0.15s;
  }
  .gate.is-done {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .logo-btn {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    background: transparent;
    padding: 0;
    margin: 0;
    cursor: pointer;
    font: inherit;
    position: absolute;
    left: 50%;
    top: 50%;
    /* Largeur = 58% du plus petit côté de l'écran, plafonnée */
    width: min(58vmin, 420px);
    max-width: calc(100% - 48px);
    /* Vrai centre géométrique, tous viewports */
    transform: translate(-50%, -50%);
    opacity: 1;
    transition:
      transform 1.15s cubic-bezier(0.33, 0.1, 0.2, 1),
      opacity 0.85s ease 0.15s;
  }
  .gate.is-rising .logo-btn {
    /* Conserve le -50% horizontal, monte hors écran */
    transform: translate(-50%, calc(-50% - 120vh));
    opacity: 0;
  }
  .logo-btn:focus-visible {
    outline: 2px solid var(--accent-deep);
    outline-offset: 10px;
  }
  .logo-btn img {
    width: 100%;
    height: auto;
    aspect-ratio: 1;
    display: block;
    object-fit: contain;
    object-position: center;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .gate,
    .logo-btn,
    #carousel { transition: none !important; }
    .gate.is-rising .logo-btn {
      transform: translate(-50%, -50%);
      opacity: 0;
    }
  }

  /* ========== CARROUSEL — présentation papeterie ========== */
  #carousel {
    display: none;
    opacity: 0;
    transition: opacity 1s ease;
  }
  #carousel.is-visible {
    display: block;
    opacity: 1;
  }

  .carousel-inner {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 3vh, 40px) 12px;
    box-sizing: border-box;
    /* Même papier que l'entrée — continuité visuelle */
    background-color: var(--bg);
    background-image: url('fondpapier.png');
    background-size: cover;
    background-position: center;
  }

  .carousel-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vw, 28px);
    width: 100%;
    max-width: 100%;
  }

  /*
    Carte entière visible sur tout écran :
    largeur plafonnée par la largeur dispo ET par la hauteur dispo (ratio 1240×1748)
  */
  .card-slot {
    --card-max-h: calc(100dvh - 56px);
    position: relative;
    width: min(
      340px,
      calc(100vw - 96px),
      calc(var(--card-max-h) * 1240 / 1748)
    );
    aspect-ratio: 1240 / 1748;
    max-height: var(--card-max-h);
    flex: none;
    padding: 0;
    background: transparent;
    border: none;
    box-shadow:
      0 18px 40px -18px rgba(59, 46, 66, 0.14),
      0 6px 14px -8px rgba(124, 94, 150, 0.08);
  }

  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.55s ease, visibility 0.55s ease;
    z-index: 1;
  }
  .slide.is-active {
    opacity: 1;
    visibility: visible;
    z-index: 1;
  }

  .slide-card {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    object-position: center;
    background: var(--card-bg);
  }

  .slide-placeholder {
    width: 100%;
    height: 100%;
    background: var(--card-bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 40px;
  }

  /* ========== RSVP (dernière slide) ========== */
  .rsvp-card {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(20px, 5%, 40px) clamp(18px, 6%, 36px);
    background-color: var(--bg);
    background-image: url('fondpapier.png');
    background-size: cover;
    background-position: center;
    overflow: auto;
  }

  .rsvp-eyebrow {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-style: italic;
    font-size: clamp(15px, 3.6vw, 18px);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent-deep);
    margin: 0 0 14px;
  }

  .rsvp-lead {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(14px, 3.5vw, 17px);
    color: var(--soft);
    margin: 0 0 28px;
    max-width: 260px;
    line-height: 1.45;
  }

  .rsvp-form {
    width: 100%;
    max-width: 280px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    text-align: left;
  }

  .rsvp-field label {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-style: italic;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent-deep);
    margin-bottom: 7px;
  }

  .rsvp-field input,
  .rsvp-field textarea,
  .rsvp-field select {
    width: 100%;
    box-sizing: border-box;
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 500;
    font-size: 17px;
    color: var(--ink);
    background: rgba(253, 251, 250, 0.72);
    border: none;
    border-bottom: 1px solid var(--accent);
    border-radius: 0;
    padding: 8px 2px;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    transition: border-color 0.25s ease, background-color 0.25s ease;
  }
  .rsvp-field input:focus,
  .rsvp-field textarea:focus,
  .rsvp-field select:focus {
    border-bottom-color: var(--accent-deep);
    background: rgba(253, 251, 250, 0.92);
  }
  .rsvp-field textarea {
    resize: none;
    min-height: 56px;
    line-height: 1.4;
  }

  .rsvp-choice {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .rsvp-choice input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }
  .rsvp-choice label {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-style: italic;
    letter-spacing: 0.14em;
    font-size: 14px;
    text-align: center;
    padding: 10px 8px;
    border: 1px solid var(--accent);
    color: var(--soft);
    cursor: pointer;
    background: rgba(253, 251, 250, 0.55);
    transition: border-color 0.25s ease, color 0.25s ease, background-color 0.25s ease;
  }
  .rsvp-choice input:checked + label {
    border-color: var(--accent-deep);
    color: var(--accent-deep);
    background: var(--accent-light);
  }
  .rsvp-choice input:focus-visible + label {
    outline: 2px solid var(--accent-deep);
    outline-offset: 2px;
  }

  .rsvp-submit {
    appearance: none;
    -webkit-appearance: none;
    margin-top: 8px;
    align-self: center;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-style: italic;
    font-size: 14px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent-deep);
    background: transparent;
    border: 1px solid var(--accent);
    padding: 12px 28px;
    cursor: pointer;
    transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
  }
  .rsvp-submit:hover,
  .rsvp-submit:focus-visible {
    background: var(--accent-light);
    border-color: var(--accent-deep);
    outline: none;
  }

  .rsvp-submit:disabled {
    opacity: 0.55;
    cursor: wait;
  }

  .rsvp-error {
    display: none;
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: #8B4A5A;
    text-align: center;
    line-height: 1.4;
  }
  .rsvp-card.has-error .rsvp-error {
    display: block;
  }

  .rsvp-thanks {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 12px;
  }
  .rsvp-card.is-sent .rsvp-form { display: none; }
  .rsvp-card.is-sent .rsvp-thanks { display: flex; }
  .rsvp-thanks p {
    margin: 0;
    font-family: 'Great Vibes', cursive;
    font-style: normal;
    font-size: 28px;
    color: var(--ink);
    line-height: 1.35;
    max-width: 260px;
  }

  /* Flèches discrètes, style gravure */
  .nav-btn {
    all: unset;
    cursor: pointer;
    width: 44px;
    height: 44px;
    border: 1px solid var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    background: var(--card-bg);
    color: var(--accent-deep);
    transition:
      border-color 0.3s ease,
      background-color 0.3s ease,
      transform 0.3s ease;
  }
  .nav-btn:hover {
    border-color: var(--accent-deep);
    background-color: var(--accent-light);
    transform: scale(1.04);
  }
  .nav-btn:focus-visible {
    outline: 2px solid var(--accent-deep);
    outline-offset: 3px;
  }
  .nav-btn svg {
    display: block;
  }

  @media (max-width: 600px) {
    .carousel-row { gap: 6px; }
    .nav-btn { width: 34px; height: 34px; }
    .card-slot {
      --card-max-h: calc(100dvh - 48px);
      width: min(
        300px,
        calc(100vw - 80px),
        calc(var(--card-max-h) * 1240 / 1748)
      );
    }
  }

  @media (max-height: 700px) {
    .card-slot {
      --card-max-h: calc(100dvh - 40px);
      width: min(
        280px,
        calc(100vw - 88px),
        calc(var(--card-max-h) * 1240 / 1748)
      );
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .slide { transition: none !important; }
  }
</style>
</head>
<body>
<div class="stage">

  <!-- ===================== LOGO SUR PAPIER ===================== -->
  <div id="gate" class="gate">
    <button id="openBtn" class="logo-btn" aria-label="Entrer dans l'invitation">
      <img src="logowf.png" alt="Monogramme" width="366" height="366" decoding="async">
    </button>
  </div>

  <!-- ===================== CARROUSEL ===================== -->
  <div id="carousel">
  <div class="carousel-inner">

    <div class="carousel-row">

      <button id="prevBtn" class="nav-btn" aria-label="Carte précédente">
        <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="card-slot" aria-live="polite">

        <div class="slide is-active" data-slide="0">
          <img
            class="slide-card"
            src="accueil.jpg"
            alt="Faire-part Accueil — Ilana &amp; Jonathan, 25 mai 2027"
            width="1240"
            height="1748"
            decoding="async"
          >
        </div>

        <div class="slide" data-slide="1">
          <img
            class="slide-card"
            src="mairie.png"
            alt="Faire-part Mairie — Ilana &amp; Jonathan"
            width="1240"
            height="1748"
            decoding="async"
          >
        </div>

        <div class="slide" data-slide="2">
          <div class="slide-placeholder">
            <div style="font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 14px; letter-spacing: 3px; color: var(--accent-deep); text-transform: uppercase;">Houppa</div>
            <div style="font-size: 14px; color: var(--soft); font-style: italic;">à venir</div>
          </div>
        </div>

        <!-- Slide 3 — RSVP -->
        <div class="slide" data-slide="3">
          <div class="rsvp-card" id="rsvpCard">
            <p class="rsvp-eyebrow">Réponse</p>
            <p class="rsvp-lead">Merci de confirmer votre présence</p>

            <form class="rsvp-form" id="rsvpForm" novalidate>
              <div class="rsvp-field">
                <label for="rsvpName">Nom &amp; prénom</label>
                <input id="rsvpName" name="name" type="text" autocomplete="name" required>
              </div>

              <div class="rsvp-field">
                <label id="rsvpPresenceLabel">Présence</label>
                <div class="rsvp-choice" role="group" aria-labelledby="rsvpPresenceLabel">
                  <input type="radio" id="rsvpYes" name="presence" value="oui" required>
                  <label for="rsvpYes">Oui</label>
                  <input type="radio" id="rsvpNo" name="presence" value="non">
                  <label for="rsvpNo">Non</label>
                </div>
              </div>

              <div class="rsvp-field">
                <label for="rsvpGuests">Nombre de personnes</label>
                <input id="rsvpGuests" name="guests" type="number" min="1" max="20" value="1" inputmode="numeric">
              </div>

              <button type="submit" class="rsvp-submit" id="rsvpSubmit">Envoyer</button>
              <p class="rsvp-error" id="rsvpError" role="alert">Impossible d’envoyer pour le moment. Réessaie un peu plus tard.</p>
            </form>

            <div class="rsvp-thanks" role="status" aria-live="polite">
              <p>Merci pour votre réponse.<br>Au plaisir de célébrer avec vous.</p>
            </div>
          </div>
        </div>

      </div>

      <button id="nextBtn" class="nav-btn" aria-label="Carte suivante">
        <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 L17 12 L9 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

    </div>

  </div>
  </div>

</div>


<script>
(function () {
  var idx = 0;
  var total = 4;
  var opening = false;
  var gate = document.getElementById('gate');
  var carousel = document.getElementById('carousel');
  var openBtn = document.getElementById('openBtn');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var slides = document.querySelectorAll('.slide');
  var rsvpForm = document.getElementById('rsvpForm');
  var rsvpCard = document.getElementById('rsvpCard');
  var rsvpSubmit = document.getElementById('rsvpSubmit');
  var rsvpError = document.getElementById('rsvpError');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /**
   * Colle ici l'URL de ton Apps Script (Déployer → Application Web).
   * Voir le fichier rsvp-google-apps-script.gs pour la procédure.
   */
  var RSVP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzVVhnRpjEKeAosWOzwWkkvgvrwpMlbkJ6H3BXjbr-AlzO-1nu6ir3Wvhmw5l6Z81XkfQ/exec';

  function render() {
    slides.forEach(function (el) {
      var active = parseInt(el.getAttribute('data-slide'), 10) === idx;
      el.classList.toggle('is-active', active);
    });
  }

  openBtn.addEventListener('click', function () {
    if (opening) return;
    opening = true;

    gate.classList.add('is-rising');
    carousel.classList.add('is-visible');

    var riseMs = reduceMotion ? 0 : 1100;
    setTimeout(function () {
      gate.classList.add('is-done');
      setTimeout(function () {
        gate.style.display = 'none';
      }, reduceMotion ? 0 : 700);
    }, riseMs);
  });

  prevBtn.addEventListener('click', function () {
    idx = (idx - 1 + total) % total;
    render();
  });

  nextBtn.addEventListener('click', function () {
    idx = (idx + 1) % total;
    render();
  });

  if (rsvpForm && rsvpCard) {
    rsvpForm.addEventListener('submit', function (e) {
      e.preventDefault();
      rsvpCard.classList.remove('has-error');

      if (!rsvpForm.checkValidity()) {
        rsvpForm.reportValidity();
        return;
      }

      if (!RSVP_SCRIPT_URL) {
        rsvpCard.classList.add('has-error');
        if (rsvpError) {
          rsvpError.textContent = 'Configure d’abord l’URL Google Sheets (RSVP_SCRIPT_URL).';
        }
        return;
      }

      var presenceEl = rsvpForm.querySelector('input[name="presence"]:checked');
      var payload = {
        name: (document.getElementById('rsvpName').value || '').trim(),
        presence: presenceEl ? presenceEl.value : '',
        guests: document.getElementById('rsvpGuests').value || '1'
      };

      if (rsvpSubmit) {
        rsvpSubmit.disabled = true;
        rsvpSubmit.textContent = 'Envoi…';
      }

      // text/plain évite le preflight CORS avec Apps Script
      fetch(RSVP_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
        .then(function () {
          // no-cors : pas de lecture de réponse, mais l'envoi part bien
          rsvpCard.classList.add('is-sent');
        })
        .catch(function () {
          rsvpCard.classList.add('has-error');
          if (rsvpError) {
            rsvpError.textContent = 'Impossible d’envoyer pour le moment. Réessaie un peu plus tard.';
          }
          if (rsvpSubmit) {
            rsvpSubmit.disabled = false;
            rsvpSubmit.textContent = 'Envoyer';
          }
        });
    });
  }

  render();
})();
</script>
</body>
</html>
