<head>
<meta charset="utf-8">

<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="Ilana &amp; Jonathan">
<meta property="og:title" content="Ilana &amp; Jonathan — Faire-part de mariage">
<meta property="og:description" content="Ilana &amp; Jonathan ont le plaisir de vous convier à leur mariage.">
<meta property="og:url" content="https://shisabbah.github.io/ilana-jonathan/">
<meta property="og:image" content="https://shisabbah.github.io/ilana-jonathan/logo2.png">

<meta property="og:image:height" content="1024">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ilana &amp; Jonathan — Faire-part de mariage">
<meta name="twitter:description" content="Ilana &amp; Jonathan ont le plaisir de vous convier à leur mariage.">
<meta name="twitter:image" content="https://shisabbah.github.io/ilana-jonathan/logo2.png">

<link rel="apple-touch-icon" href="logo2.png">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
:root {
  --accent: #B7A0CC;
  --accent-deep: #7C5E96;
  --accent-soft: #D4C6E0;
  --bg: #F4F0EA;
  --paper: #FBF8F4;
  --ink: #3B2E42;
  --soft: #8A7B90;
  --gold: #A8926A;
  --shadow: 0 1.1rem 2.4rem -1.4rem rgba(59, 46, 66, 0.16);
  --ease-invite: cubic-bezier(0.22, 0.61, 0.36, 1);
  --font-display: 'Cormorant Garamond', 'Times New Roman', serif;
  --font-body: 'EB Garamond', Georgia, serif;
}

*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}
html.is-reading {
  scroll-snap-type: y proximity;
}

body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

button { font: inherit; }

/* ========== COUVERTURE ========== */
.accueil {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2rem;
  padding:
    max(2.5rem, env(safe-area-inset-top))
    1.5rem
    max(2.5rem, env(safe-area-inset-bottom));
  background-color: var(--bg);
  background-image: url('fondpapier.png');
  background-size: cover;
  background-position: center;
  cursor: pointer;
  border: 0;
  width: 100%;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  transform-origin: 50% 40%;
  transition:
    opacity 0.85s var(--ease-invite),
    transform 0.95s var(--ease-invite),
    visibility 0.85s var(--ease-invite);
}
.accueil.is-opening {
  transform: translateY(-6%) scale(0.985);
  opacity: 0;
  pointer-events: none;
}
.accueil.is-done {
  visibility: hidden;
}

.accueil-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.85rem;
  max-width: 22rem;
  width: 100%;
}

.accueil-logo {
  width: min(52vmin, 17.5rem);
  max-width: calc(100% - 0.5rem);
  pointer-events: none;
  transition: transform 0.55s var(--ease-invite);
}
@media (hover: hover) and (pointer: fine) {
  .accueil:hover .accueil-logo {
    transform: translateY(-0.2rem);
  }
}
.accueil-logo img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1;
  object-fit: contain;
  filter: drop-shadow(0 0.35rem 0.9rem rgba(59, 46, 66, 0.06));
}

.accueil-cta {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.85rem;
  pointer-events: none;
  transition: opacity 0.4s ease, transform 0.55s var(--ease-invite);
}
.accueil.is-opening .accueil-cta {
  opacity: 0;
  transform: translateY(0.4rem);
}

.accueil-bubble {
  margin: 0;
  padding: 0.65rem 1.4rem 0.6rem;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 0.8rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent-deep);
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 70%, transparent);
  border-radius: 999px;
  line-height: 1.2;
}

.accueil-hint {
  margin: 0;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 400;
  font-size: 0.95rem;
  letter-spacing: 0.04em;
  color: var(--soft);
}

.accueil:focus-visible {
  outline: 2px solid var(--accent-deep);
  outline-offset: -0.6rem;
}

/* ========== INVITATIONS ========== */
#pages {
  display: none;
  min-height: 100dvh;
  opacity: 0;
  transform: translateY(1.1rem);
  transition:
    opacity 0.9s var(--ease-invite) 0.12s,
    transform 0.95s var(--ease-invite) 0.12s;
}
#pages.is-visible {
  display: block;
  opacity: 1;
  transform: none;
}

.page {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.15rem;
  padding:
    max(1.35rem, env(safe-area-inset-top))
    1rem
    max(1.75rem, env(safe-area-inset-bottom));
  background-color: var(--bg);
  background-image: url('fondpapier.png');
  background-size: cover;
  background-position: center;
  scroll-snap-align: start;
  scroll-snap-stop: always;
}

.page-head {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.55rem;
  width: min(100%, 26rem);
}

.page-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(0.78rem, 2.6vw, 0.88rem);
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--accent-deep);
  text-align: center;
}

.page-rule {
  width: 2.4rem;
  height: 1px;
  background: var(--accent);
  opacity: 0.75;
  border: 0;
  margin: 0;
}

.card {
  width: min(100%, 26rem);
  background: var(--paper);
  box-shadow: var(--shadow);
  line-height: 0;
}

.card img {
  display: block;
  width: 100%;
  height: auto;
  max-height: calc(100dvh - 6.5rem);
  object-fit: contain;
  object-position: center top;
  background: var(--paper);
}

.page-nav {
  margin: 0;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 0.9rem;
  color: var(--soft);
  letter-spacing: 0.03em;
}

.page-nav a {
  color: var(--accent-deep);
  text-decoration: none;
  border-bottom: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
  padding-bottom: 0.05em;
  transition: border-color 0.25s ease, color 0.25s ease;
}
@media (hover: hover) and (pointer: fine) {
  .page-nav a:hover {
    color: var(--ink);
    border-bottom-color: var(--accent-deep);
  }
}

/* ========== MUSIQUE ========== */
.music-btn {
  position: fixed;
  z-index: 40;
  right: max(0.9rem, env(safe-area-inset-right));
  bottom: max(0.9rem, env(safe-area-inset-bottom));
  width: 2.6rem;
  height: 2.6rem;
  border: 1px solid color-mix(in srgb, var(--accent) 65%, transparent);
  border-radius: 50%;
  background: color-mix(in srgb, var(--paper) 90%, transparent);
  color: var(--accent-deep);
  cursor: pointer;
  display: none;
  place-items: center;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: opacity 0.35s ease, transform 0.2s ease, border-color 0.25s ease;
  -webkit-tap-highlight-color: transparent;
}
.music-btn.is-on { display: grid; }
.music-btn:active { transform: scale(0.96); }
.music-btn:focus-visible {
  outline: 2px solid var(--accent-deep);
  outline-offset: 3px;
}
.music-btn svg {
  width: 1.05rem;
  height: 1.05rem;
  fill: currentColor;
}
.music-btn .icon-off { display: none; }
.music-btn.is-muted .icon-on { display: none; }
.music-btn.is-muted .icon-off { display: block; }

/* ========== RESPONSIVE ========== */
@media (min-width: 480px) {
  .accueil-logo { width: min(48vmin, 18.5rem); }
  .card { width: min(100%, 27rem); }
}

@media (min-width: 768px) {
  .accueil { gap: 2.25rem; }
  .accueil-logo { width: min(42vmin, 19rem); }
  .page {
    gap: 1.35rem;
    padding-inline: 1.5rem;
  }
  .card {
    width: min(100%, 28rem);
    box-shadow: 0 1.35rem 2.8rem -1.5rem rgba(59, 46, 66, 0.14);
  }
  .card img {
    max-height: calc(100dvh - 7.5rem);
  }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .accueil,
  .accueil-logo,
  .accueil-cta,
  #pages {
    transition: none !important;
  }
  .accueil.is-opening {
    transform: none;
  }
}
</style>
</head>
<body>

  <button type="button" class="accueil" id="accueil" aria-label="Ouvrir l'invitation">
    <span class="accueil-inner">
      <span class="accueil-logo">
        <img src="logowf.png" alt="Monogramme Ilana et Jonathan" width="366" height="366" decoding="async" fetchpriority="high">
      </span>
      <span class="accueil-cta">
        <span class="accueil-bubble">Voir l’invitation</span>
        <span class="accueil-hint">Toucher pour ouvrir</span>
      </span>
    </span>
  </button>

  <main id="pages">
    <section class="page" id="mairie" aria-labelledby="titleMairie">
      <header class="page-head">
        <h2 class="page-title" id="titleMairie">La Mairie</h2>
        <hr class="page-rule" aria-hidden="true">
      </header>
      <figure class="card">
        <img
          src="mairie1.png"
          alt="Invitation — La Mairie : Ilana et Jonathan se diront oui le 25 mai 2027 à 14h30, Mairie Bagatelle, Marseille"
          width="1056"
          height="1489"
          decoding="async">
      </figure>
      <p class="page-nav"><a href="#houppa">Continuer vers la Houppa</a></p>
    </section>

    <section class="page" id="houppa" aria-labelledby="titleHouppa">
      <header class="page-head">
        <h2 class="page-title" id="titleHouppa">La Houppa</h2>
        <hr class="page-rule" aria-hidden="true">
      </header>
      <figure class="card">
        <img
          src="houppa3.png"
          alt="Invitation — La Houppa : cérémonie religieuse le jeudi 27 mai à 15h00 au Domaine des Calanques"
          width="941"
          height="1672"
          decoding="async"
          loading="lazy">
      </figure>
      <p class="page-nav"><a href="#mairie">Revenir à la Mairie</a></p>
    </section>
  </main>

  <audio id="bgMusic" src="musique.mp3" loop preload="metadata" playsinline></audio>

  <button type="button" class="music-btn" id="musicBtn" aria-label="Couper la musique" aria-pressed="false" hidden>
    <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h3l4 3V7L6 10H3zm11.5 2a2.5 2.5 0 0 0-1.5-2.3v4.6a2.5 2.5 0 0 0 1.5-2.3zm-1.5-6.2v1.6a4.5 4.5 0 0 1 0 9.2v1.6a6.1 6.1 0 0 0 0-12.4z"/></svg>
    <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 12a2.5 2.5 0 0 0-1.5-2.3v2.5l1.5 1.5V12zm2.5 0c0 .9-.2 1.7-.6 2.4l1.2 1.2A5.9 5.9 0 0 0 20.5 12a6.1 6.1 0 0 0-3.5-5.5v1.6A4.5 4.5 0 0 1 19 12zM4.3 3 3 4.3 7.7 9H3v4h3l4 3v-5.7l5.7 5.7 1.3-1.3L4.3 3zM14 3.2v1.6l-2 2V3.2L14 3.2z"/></svg>
  </button>

<script>
(function () {
  var accueil = document.getElementById('accueil');
  var pages = document.getElementById('pages');
  var music = document.getElementById('bgMusic');
  var musicBtn = document.getElementById('musicBtn');
  var opened = false;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  music.volume = 0.48;

  function setMuted(muted) {
    music.muted = muted;
    musicBtn.classList.toggle('is-muted', muted);
    musicBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
    musicBtn.setAttribute('aria-label', muted ? 'Remettre la musique' : 'Couper la musique');
  }

  function startMusic() {
    music.play().then(function () {
      musicBtn.hidden = false;
      musicBtn.classList.add('is-on');
      setMuted(false);
    }).catch(function () {
      musicBtn.hidden = false;
      musicBtn.classList.add('is-on', 'is-muted');
      setMuted(true);
    });
  }

  function openInvite() {
    if (opened) return;
    opened = true;

    pages.style.display = 'block';
    // Force reflow so the enter transition runs
    void pages.offsetWidth;
    pages.classList.add('is-visible');
    document.documentElement.classList.add('is-reading');
    accueil.classList.add('is-opening');

    window.setTimeout(function () {
      accueil.classList.add('is-done');
      accueil.setAttribute('aria-hidden', 'true');
      accueil.tabIndex = -1;
    }, reduceMotion ? 0 : 950);

    startMusic();
  }

  musicBtn.addEventListener('click', function () {
    if (music.paused) {
      music.muted = false;
      music.play().then(function () { setMuted(false); }).catch(function () {});
      return;
    }
    setMuted(!music.muted);
  });

  accueil.addEventListener('click', openInvite);
  accueil.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openInvite();
    }
  });
})();
</script>
</body>
</html>
